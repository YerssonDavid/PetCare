spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: petcare-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:petcare}
    username: ${POSTGRES_USER:petcare}
    password: ${POSTGRES_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

